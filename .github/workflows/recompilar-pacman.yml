name: Recompilar Pacman Colors Xbox 360

on:
  workflow_dispatch: # Ativa o botao manual no celular

jobs:
  traduzir-xex:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio do Pacman
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Instalar Dependencias do Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build clang libtinfo-dev zlib1g-dev

    # ETAPA 1: Compila a ferramenta do ReXGlue usando o Clang obrigatorio
    - name: Compilar o Tradutor ReXGlue
      run: |
        mkdir -p build_sdk && cd build_sdk
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DZLIB_USE_STATIC_LIBS=ON \
              -DREXGLUE_BUILD_TOOLS=OFF ..
        cmake --build . --target rexglue --parallel $(nproc)
        mv bin/rexglue ../
        cd ..

    # ETAPA 2: Inicializa as pastas lógicas para o Pacman
    - name: Inicializar Projeto do Jogo
      run: |
        ./rexglue init --project-name pacman_colors --xex-path default.xex --game-root ./ --project-root ./pacman_project

    # ETAPA 3: Faz a engenharia reversa e cospe o jogo transformado em C++ portátil
    - name: Executar Engenharia Reversa (.XEX para C++)
      run: |
        cd pacman_project
        ../rexglue codegen
        echo "Sucesso! O cérebro do Xbox 360 virou código legível por humanos."

    # ETAPA 4: Guarda todo o código fonte traduzido em um arquivo zip para você
    - name: Disponibilizar Codigo Fonte Traduzido
      uses: actions/upload-artifact@v4
      with:
        name: pacman-codigo-cplusplus
        path: pacman_project/
