name: Recompilar Pacman Colors Xbox 360

on:
  workflow_dispatch: # Inicia pelo botao no celular

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # CORREÇÃO CRÍTICA: Usando o configurador oficial nativo do Android SDK/NDK
    - name: Configurar Android SDK e NDK Oficial
      uses: maxim-lobanov/setup-android@v1
      with:
        api-level: 29
        ndk-version: 25.2.9519653

    - name: Traduzir Executavel (.XEX para C++)
      run: |
        python3 roteiros/codegen.py --input default.xex --output src/codegen_out/
        echo "Codigo de Xbox 360 traduzido com sucesso!"

    - name: Compilar APK Android
      run: |
        mkdir -p build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-26 \
              ..
        make

    - name: Upload do APK Pronto
      uses: actions/upload-artifact@v4
      with:
        name: pacman-colors-android
        path: build/outputs/
        
