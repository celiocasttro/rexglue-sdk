
name: Recompilar Pac-Man para Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang \
            lld \
            git \
            pkg-config \
            python3 \
            unzip \
            zip

      - name: Verificar ambiente
        run: |
          echo "=== CMake ==="
          cmake --version

          echo "=== Ninja ==="
          ninja --version

          echo "=== Clang ==="
          clang --version

          echo "=== Arquivos do projeto ==="
          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f default.xex

          echo "default.xex encontrado."
          echo "=== Presets disponíveis ==="
          cmake --list-presets

      - name: Configurar SDK ReXGlue
        run: cmake --preset linux-amd64

      - name: Compilar e instalar SDK ReXGlue
        run: |
          cmake --build \
            --preset linux-amd64-release \
            --target install

      - name: Localizar executavel ReXGlue
        id: rexglue
        run: |
          echo "=== Procurando executavel ==="

          find out/install out/build \
            -type f -name rexglue -perm /111 \
            -print 2>/dev/null || true

          REXGLUE_BIN="$(find out/install out/build \
            -type f -name rexglue -perm /111 \
            -print -quit 2>/dev/null || true)"

          if [ -z "$REXGLUE_BIN" ]; then
            echo "::error::Executavel rexglue nao encontrado."
            echo "Verifique os logs da compilacao e instalacao."
            exit 1
          fi

          echo "REXGLUE_BIN=$GITHUB_WORKSPACE/$REXGLUE_BIN" \
            >> "$GITHUB_ENV"

          "$GITHUB_WORKSPACE/$REXGLUE_BIN" --help

      - name: Inicializar projeto Pac-Man
        run: |
          mkdir -p pacman_project

          "$REXGLUE_BIN" init \
            --project-name pacman_colors \
            --xex-path "$GITHUB_WORKSPACE/default.xex" \
            --game-root "$GITHUB_WORKSPACE" \
            --project-root "$GITHUB_WORKSPACE/pacman_project"

      - name: Verificar arquivos gerados
        run: |
          echo "=== Arquivos do projeto Pac-Man ==="
          find pacman_project -maxdepth 4 -type f \
            -print | sort

          echo "=== Procurando configuracao TOML ==="
          find pacman_project -type f \
            -name '*.toml' -print

      - name: Gerar codigo do Pac-Man
        working-directory: pacman_project
        run: |
          CONFIG="$(find . -type f -name '*.toml' \
            ! -path './build*/*' -print -quit)"

          if [ -z "$CONFIG" ]; then
            echo "::error::Nenhum arquivo TOML encontrado."
            exit 1
          fi

          echo "Configuracao encontrada: $CONFIG"
          "$REXGLUE_BIN" codegen "$CONFIG"

      - name: Preparar Android NDK
        run: |
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          test -f \
            "$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"

      - name: Verificar suporte de compilacao Android
        run: |
          echo "=== CMakeLists do projeto gerado ==="
          if [ -f pacman_project/CMakeLists.txt ]; then
            cat pacman_project/CMakeLists.txt
          else
            echo "::error::CMakeLists.txt do projeto nao encontrado."
            exit 1
          fi

          echo "=== Verificar suporte Vulkan ==="
          grep -R -n -i 'vulkan\|ANDROID_ABI\|android.toolchain' \
            pacman_project \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            --include='*.mk' || true

      - name: Salvar arquivos de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-pacman
          path: |
            pacman_project/
            out/
          if-no-files-found: ignore
          retention-days: 7
          
