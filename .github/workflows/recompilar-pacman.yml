```yaml
name: Recompilar Pac-Man para Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            ca-certificates \
            build-essential \
            cmake \
            ninja-build \
            git \
            pkg-config \
            python3 \
            unzip \
            zip

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

      - name: Verificar ambiente
        run: |
          set -e

          cmake --version
          ninja --version
          clang-21 --version
          clang++-21 --version

          test -f CMakeLists.txt
          test -f CMakePresets.json
          test -f default.xex

          echo "default.xex encontrado."
          cmake --list-presets

      - name: Configurar SDK ReXGlue
        run: |
          set -e

          cmake --preset linux-amd64 \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21

      - name: Compilar SDK ReXGlue
        run: |
          set -e

          cmake --build \
            --preset linux-amd64-release \
            --parallel 2

      - name: Localizar executavel ReXGlue
        run: |
          set -e

          REXGLUE_REL="$(find out -type f \
            -name rexglue \
            -perm /111 \
            -print -quit 2>/dev/null || true)"

          if [ -z "$REXGLUE_REL" ]; then
            echo "::error::Executavel rexglue nao encontrado."
            exit 1
          fi

          REXGLUE_BIN="$GITHUB_WORKSPACE/$REXGLUE_REL"

          echo "REXGLUE_BIN=$REXGLUE_BIN" >> "$GITHUB_ENV"

          echo "Executavel encontrado: $REXGLUE_BIN"
          "$REXGLUE_BIN" --help

      - name: Inicializar projeto Pac-Man
        run: |
          set -e

          mkdir -p pacman_project

          "$REXGLUE_BIN" init \
            --project-name pacman_colors \
            --xex-path "$GITHUB_WORKSPACE/default.xex" \
            --game-root "$GITHUB_WORKSPACE" \
            --project-root "$GITHUB_WORKSPACE/pacman_project"

      - name: Verificar arquivos gerados
        run: |
          set -e

          echo "=== Arquivos do projeto ==="
          find pacman_project -maxdepth 4 -type f -print | sort

          CONFIG="$(find pacman_project \
            -type f -name '*.toml' \
            -print -quit)"

          if [ -z "$CONFIG" ]; then
            echo "::error::Nenhum arquivo TOML encontrado."
            exit 1
          fi

          echo "REXGLUE_CONFIG=$GITHUB_WORKSPACE/$CONFIG" \
            >> "$GITHUB_ENV"

      - name: Gerar codigo do Pac-Man
        run: |
          set -e

          "$REXGLUE_BIN" codegen "$REXGLUE_CONFIG"

          echo "Geracao de codigo concluida."

      - name: Localizar Android NDK
        run: |
          set -e

          NDK="${ANDROID_NDK_LATEST_HOME:-}"

          if [ -z "$NDK" ] || \
             [ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
            NDK="${ANDROID_NDK_HOME:-}"
          fi

          if [ -z "$NDK" ] || \
             [ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
            NDK="${ANDROID_NDK_ROOT:-}"
          fi

          if [ -z "$NDK" ] || \
             [ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
            echo "::error::Android NDK nao encontrado."
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "Android NDK encontrado: $NDK"

      - name: Verificar configuracao Android
        run: |
          set -e

          if [ ! -f pacman_project/CMakeLists.txt ]; then
            echo "::error::CMakeLists.txt do projeto nao encontrado."
            exit 1
          fi

          echo "=== CMakeLists.txt do projeto ==="
          cat pacman_project/CMakeLists.txt

          echo "=== Referencias Android e Vulkan ==="

          grep -R -n -i \
            'vulkan\|ANDROID_ABI\|android.toolchain' \
            pacman_project \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            --include='*.mk' || true

      - name: Salvar diagnosticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-pacman
          path: |
            pacman_project/
            out/
          if-no-files-found: ignore
          retention-days: 7
```
