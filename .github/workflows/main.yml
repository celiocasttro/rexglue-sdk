name: Recompilar Pac-Man para Android

on:
workflow_dispatch:

permissions:
contents: read

jobs:
diagnostico:
name: Verificar projeto ReXGlue
runs-on: ubuntu-latest

steps:
  - name: Baixar repositorio
    uses: actions/checkout@v4
    with:
      submodules: recursive
  - name: Instalar ferramentas
    run: |
      sudo apt-get update
      sudo apt-get install -y cmake ninja-build clang lld git python3
  - name: Configurar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
  - name: Configurar Android SDK
    uses: android-actions/setup-android@v3
  - name: Verificar ferramentas
    run: |
      echo "=== CMake ==="
      cmake --version
      echo "=== Ninja ==="
      ninja --version
      echo "=== Clang ==="
      clang --version
      echo "=== Java ==="
      java -version
      echo "=== Android SDK ==="
      echo "ANDROID_HOME=$ANDROID_HOME"
      echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
  - name: Verificar arquivos do projeto
    run: |
      echo "=== Arquivo principal ==="
      test -f CMakeLists.txt && echo "CMakeLists.txt encontrado"
      echo "=== Executaveis Xbox 360 ==="
      find . -type f -iname '*.xex' -print
      echo "=== Manifestos ReXGlue ==="
      find . -type f -iname '*manifest*.toml' -print
      echo "=== Scripts Python ==="
      find . -type f -name '*.py' -print
      echo "=== Configuracao Android ==="
      find . -type f \( -name 'Android.mk' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print
  - name: Verificar presets CMake
    run: |
      if [ -f CMakePresets.json ]; then
        python3 -c '
      import json
      with open("CMakePresets.json", encoding="utf-8") as f:
          data = json.load(f)
      print("Presets encontrados:")
      for preset in data.get("configurePresets", []):
          print("-", preset.get("name", "(sem nome)"))
      '
      else
        echo "CMakePresets.json nao encontrado"
      fi
  - name: Resultado
    if: always()
    run: |
      echo "Diagnostico finalizado."
      echo "Este workflow verifica os arquivos e as ferramentas."
      echo "Ele ainda nao gera um APK."
      echo "A recompilacao exige adaptar o ReXGlue para Android e ter os arquivos originais do jogo."
