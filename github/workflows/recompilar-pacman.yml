name: Recompilar Pacman Colors Xbox 360

on:
  workflow_dispatch: # Inicia pelo botão no celular

jobs:
  build-android:
    runs-runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Android NDK
      uses: android-actions/setup-android@v3
      
    - name: Traduzir Executavel (.XEX para C++)
      run: |
        python3 roteiros/codegen.py --input default.xex --output src/codegen_out/
        echo "Código de Xbox 360 traduzido com sucesso!"

    - name: Compilar APK Android
      run: |
        cd cmake
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-26 \
              ..
        make

    - name: Upload do APK Pronto
      uses: actions/upload-artifact@v4
      with:
        name: pacman-colors-android
        path: build/outputs/
