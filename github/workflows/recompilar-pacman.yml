name: ReXGlue - Compilar SDK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build-linux:
name: Compilar ReXGlue para Linux
runs-on: ubuntu-latest

steps:
  - name: Baixar repositorio
    uses: actions/checkout@v4
    with:
      submodules: recursive
  - name: Instalar dependencias
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        cmake \
        ninja-build \
        clang \
        lld \
        git \
        python3 \
        pkg-config \
        libxcursor-dev \
        libx11-dev \
        libxext-dev \
        libxrender-dev \
        libxi-dev \
        libxfixes-dev \
        libxrandr-dev \
        libxss-dev \
        libxtst-dev \
        libwayland-dev \
        libxkbcommon-dev \
        libegl1-mesa-dev \
        libgl1-mesa-dev \
        libvulkan-dev \
        libasound2-dev \
        libpulse-dev \
        libudev-dev
  - name: Verificar ferramentas
    run: |
      cmake --version
      ninja --version
      clang --version
  - name: Configurar projeto
    run: |
      cmake --preset linux-amd64 \
        -DSDL_X11_XCURSOR=OFF
  - name: Compilar SDK
    run: |
      cmake --build --preset linux-amd64 --parallel 2
  - name: Localizar arquivos compilados
    if: success()
    run: |
      echo "Arquivos gerados:"
      find out -type f -executable -print || true
  - name: Salvar arquivos compilados
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: rexglue-linux-amd64
      path: out/
      if-no-files-found: error
      retention-days: 7
