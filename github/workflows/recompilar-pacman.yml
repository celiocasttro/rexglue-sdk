name: ReXGlue - Compilar Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Gerar e Compilar Pac-Man Colors para Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar ferramentas do Host
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            git \
            python3 \
            pkg-config

      - name: 1. Compilar ferramenta Host (ReXGlue CLI)
        run: |
          cmake -B build-host -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --config Release

      - name: 2. Inicializar Projeto e Gerar Código a partir do XEX
        run: |
          if [ ! -f "default.xex" ]; then
            echo "::error::Arquivo default.xex nao encontrado na raiz do repositorio!"
            exit 1
          }

          mkdir -p game_project
          # Inicializa o projeto do jogo usando a CLI oficial do ReXGlue
          ./build-host/bin/rexglue init --app_name "pacmancolors" --app_root "game_project"
          
          # Ajusta o caminho do binário no arquivo TOML gerado para apontar para o default.xex da raiz
          sed -i 's|file_path =.*|file_path = "../default.xex"|g' game_project/*_config.toml || true

          # Executa a geração de código estático (usando --force caso haja avisos de símbolos não resolvidos)
          ./build-host/bin/rexglue codegen --project "game_project" --force || true

      - name: Setup Java (Necessário para o Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e NDK
        uses: android-actions/setup-android@v3

      - name: 3. Configurar e Compilar para Android ARM64
        run: |
          NDK_PATH=$(find $ANDROID_SDK_ROOT -name "android.toolchain.cmake" -exec dirname {} \; | head -n 1)
          NDK_PATH=$(dirname $(dirname $NDK_PATH))

          cmake -S . -B build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DREXGLUE_BUILD_TESTS=OFF \
            -DREXGLUE_USE_VULKAN=ON

          cmake --build build/android-arm64 --parallel 2

      - name: 4. Salvar Artefatos e Código Gerado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacman-colors-android-artifacts
          path: |
            game_project/generated/
            build/android-arm64/**/*.so
            build/android-arm64/**/*.a
          if-no-files-found: warn
          retention-days: 7
